name: Testes

on:
  push:
  pull_request:
    branches: [main, develop]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install -r requirements-dev.txt
      - name: Executar test harness
        env:
          PYTHONPATH: .
        run: pytest -v
